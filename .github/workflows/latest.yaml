name: Make latest

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish as latest, empty uses the newest tagged one
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: dockerhub-latest

jobs:
  latest:
    runs-on: ubuntu-latest
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            version=$(git tag --list --sort=-v:refname |
              grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

            if [ -z "$version" ]; then
              echo "Nothing is tagged yet, pass the version explicitly" >&2
              exit 1
            fi

            echo "Newest tagged version is $version"
          fi

          if ! git rev-parse -q --verify "refs/tags/$version^{commit}" >/dev/null; then
            echo "$version is not a tag in this repository" >&2
            exit 1
          fi

          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: Check out the version
        run: git checkout --detach "refs/tags/$VERSION"

      - name: Enable foreign architectures
        uses: docker/setup-qemu-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish latest
        run: make tag-latest
